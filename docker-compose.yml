services:
  postgresql:
    image: postgres:17-alpine
    container_name: ba-event-postgresql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ba_event}
      POSTGRES_USER: ${DB_USERNAME:-ba_event}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ba_event}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ba_event} -d ${DB_DATABASE:-ba_event}"]
      interval: 3s
      retries: 10
    networks:
      - ba-event

  redis:
    image: redis:7-alpine
    container_name: ba-event-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - ba-event

  mailpit:
    image: axllent/mailpit:latest
    container_name: ba-event-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks:
      - ba-event

  api-php:
    build:
      context: ./api
      target: dev
    image: ba-event/api-php
    container_name: ba-event-api-php
    restart: unless-stopped
    working_dir: /var/www/html/api
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-ba_event}
      DB_USERNAME: ${DB_USERNAME:-ba_event}
      DB_PASSWORD: ${DB_PASSWORD:-ba_event}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM_ADDRESS: "hello@ba-event.test"
    volumes:
      - ./api/.docker/php/php.ini:/usr/local/etc/php/conf.d/ba-event.ini:ro
      - ./api:/var/www/html/api
      - /var/www/html/api/vendor
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - ba-event

  api-queue:
    build:
      context: ./api
      target: dev
    image: ba-event/api-php
    container_name: ba-event-api-queue
    restart: unless-stopped
    working_dir: /var/www/html/api
    command: php artisan queue:listen
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-ba_event}
      DB_USERNAME: ${DB_USERNAME:-ba_event}
      DB_PASSWORD: ${DB_PASSWORD:-ba_event}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./api/.docker/php/php.ini:/usr/local/etc/php/conf.d/ba-event.ini:ro
      - ./api:/var/www/html/api
      - /var/www/html/api/vendor
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - ba-event

  api-nginx:
    image: nginx:alpine
    container_name: ba-event-api-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./api/.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api:/var/www/html/api
    depends_on:
      - api-php
      - web
    networks:
      - ba-event

  web:
    build: ./web
    image: ba-event/web
    container_name: ba-event-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      - api-php
    networks:
      - ba-event

volumes:
  postgresql-data:
  redis-data:

networks:
  ba-event:
    driver: bridge
