services:
  php:
    build:
      context: .
      target: dev
    image: ba-event/php
    container_name: ba-event-php
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_DATABASE: ba_event
      DB_USERNAME: ba_event
      DB_PASSWORD: ba_event
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM_ADDRESS: "hello@ba-event.test"
      VITE_DEV_SERVER_URL: "http://localhost:5173"
    volumes:
      - ./.docker/php/php.ini:/usr/local/etc/php/conf.d/ba-event.ini:ro
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - ba-event

  nginx:
    image: nginx:alpine
    container_name: ba-event-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html
    depends_on:
      - php
    networks:
      - ba-event

  postgresql:
    image: postgres:17-alpine
    container_name: ba-event-postgresql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ba_event
      POSTGRES_USER: ba_event
      POSTGRES_PASSWORD: ba_event
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ba_event -d ba_event"]
      interval: 3s
      retries: 10
    networks:
      - ba-event

  redis:
    image: redis:7-alpine
    container_name: ba-event-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - ba-event

  mailpit:
    image: axllent/mailpit:latest
    container_name: ba-event-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks:
      - ba-event

  queue:
    build:
      context: .
      target: dev
    image: ba-event/php
    container_name: ba-event-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:listen
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_DATABASE: ba_event
      DB_USERNAME: ba_event
      DB_PASSWORD: ba_event
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./.docker/php/php.ini:/usr/local/etc/php/conf.d/ba-event.ini:ro
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - ba-event

  vite:
    image: node:22-alpine
    container_name: ba-event-vite
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - ba-event

volumes:
  postgresql-data:
  redis-data:

networks:
  ba-event:
    driver: bridge
