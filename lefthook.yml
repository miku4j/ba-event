pre-commit:
  parallel: true
  commands:
    pint:
      root: "api/"
      glob: "*.php"
      run: vendor/bin/pint --dirty {staged_files}
    eslint:
      root: "web/"
      glob: "*.{ts,tsx,js}"
      run: npm run lint -- --no-warn-ignored {staged_files}
    openapi-stale:
      run: |
        changed=$(git diff --cached --name-only -- api/app/Http api/routes)
        [ -z "$changed" ] && exit 0
        echo "⚠️  API routes/controllers changed — regenerate types:"
        echo "   php artisan l5-swagger:generate && npm run types:api"
