services:
  php:
    build:
      context: .
      target: app
    image: ba-event/app:latest
    container_name: ba-event-php
    restart: always
    working_dir: /var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"
      DB_CONNECTION: pgsql
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      LOG_CHANNEL: stack
      LOG_LEVEL: "${LOG_LEVEL:-warning}"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ba-event
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: ba-event-nginx
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_started
    networks:
      - ba-event

  postgresql:
    image: postgres:17-alpine
    container_name: ba-event-postgresql
    restart: always
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ba-event

  redis:
    image: redis:7-alpine
    container_name: ba-event-redis
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - ba-event
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  queue:
    build:
      context: .
      target: app
    image: ba-event/app:latest
    container_name: ba-event-queue
    restart: always
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: pgsql
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      LOG_CHANNEL: stack
      LOG_LEVEL: "${LOG_LEVEL:-warning}"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ba-event

  scheduler:
    build:
      context: .
      target: app
    image: ba-event/app:latest
    container_name: ba-event-scheduler
    restart: always
    working_dir: /var/www/html
    command: php artisan schedule:work
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: pgsql
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      LOG_CHANNEL: stack
      LOG_LEVEL: "${LOG_LEVEL:-warning}"
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - ba-event

volumes:
  postgresql-data:
  redis-data:

networks:
  ba-event:
    driver: bridge
